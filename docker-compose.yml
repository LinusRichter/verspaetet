# docker-compose.yml — verspaetet production stack (asynq version).
#
# Services: postgres (data), redis (asynq job queue), asynqmon (job UI),
# migrate (one-shot schema), worker (board fetch + persist),
# scheduler (periodic monitors), seeder (one-shot discovery), api (Web UI + JSON).
#
# Temporal is GONE — replaced by asynq + redis + asynqmon.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:${POSTGRESQL_VERSION}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: bahnhof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bahnhof
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahnhof"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
      - verspaetet_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - verspaetet_redis:/data

  # asynqmon — web UI for the asynq job queue (replaces Temporal UI).
  asynqmon:
    image: hibiken/asynqmon:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      ["-path", "/migrations/", "-database",
       "postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable", "up"]
    restart: "no"

  # worker — handles board:fetch + discovery:fetch tasks (replaces both
  # Temporal workers).
  worker:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine
        WORKDIR /app
        COPY . .
        RUN go mod download
        RUN go build -o /app/bin/worker ./cmd/worker
        CMD ["/app/bin/worker"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
      - ASYNQ_CONCURRENCY=10
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # scheduler — one periodic entry per station (replaces 5,500 StationMonitor
  # workflows with ONE process).
  scheduler:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine
        WORKDIR /app
        COPY . .
        RUN go mod download
        RUN go build -o /app/bin/scheduler ./cmd/scheduler
        CMD ["/app/bin/scheduler"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
      - MONITOR_CADENCE=30m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # seeder (one-shot: enqueues discovery tasks for all stations).
  seeder:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine
        WORKDIR /app
        COPY . .
        RUN go mod download
        RUN go build -o /app/bin/seeder ./cmd/seeder
        CMD ["/app/bin/seeder"]
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: "no"

  api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:alpine AS web
        WORKDIR /web
        COPY web/package.json web/package-lock.json ./
        RUN npm ci
        COPY web/ ./
        RUN npm run build
        FROM golang:alpine AS go
        WORKDIR /app
        COPY . .
        COPY --from=web /web/dist ./web/dist
        RUN go mod download
        RUN go build -o /app/bin/api ./cmd/api
        CMD ["/app/bin/api"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
      - API_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  verspaetet_pg:
    name: bahn-downfall_bahn_downfall_pg
  verspaetet_redis: