# docker-compose.yml — verspaetet production stack (asynq + IRIS).
#
# Services: postgres (data), redis (asynq job queue), asynqmon (job UI),
# migrate (one-shot schema), stationimport (one-shot StaDa station universe),
# worker (IRIS board fetch + persist), scheduler (30-min tick loop),
# api (Web UI + JSON).
#
# Data source: DB Timetables API (IRIS) — free plan, 60 req/min.
# Auth: DB-Client-ID + DB-Api-Key headers (both from developers.deutschebahn.com).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:${POSTGRESQL_VERSION}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: bahnhof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bahnhof
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahnhof"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
      - verspaetet_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - verspaetet_redis:/data

  # asynqmon — web UI for the asynq job queue.
  asynqmon:
    image: hibiken/asynqmon:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      ["-path", "/migrations/", "-database",
       "postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable", "up"]
    restart: "no"

  # stationimport (one-shot): StaDa → stations universe (all ~5400 active
  # stations with EVA, name, lat/lon, category). Also resolves pending
  # discovery names. Re-run any time; StaDa terms allow ~1 call/day.
  # CSV fallback: command: ["/app/bin/stationimport", "--csv=/stations.csv"]
  stationimport:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine
        WORKDIR /app
        COPY . .
        RUN go mod download
        RUN go build -o /app/bin/stationimport ./cmd/stationimport
        CMD ["/app/bin/stationimport"]
    environment:
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
      - IRIS_CLIENT_ID=${IRIS_CLIENT_ID}
      - IRIS_API_KEY=${IRIS_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # worker — handles board:fetch tasks (IRIS /plan + /fchg → persist).
  worker:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine
        WORKDIR /app
        COPY . .
        RUN go mod download
        RUN go build -o /app/bin/worker ./cmd/worker
        CMD ["/app/bin/worker"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
      - IRIS_CLIENT_ID=${IRIS_CLIENT_ID}
      - IRIS_API_KEY=${IRIS_API_KEY}
      - ASYNQ_CONCURRENCY=10
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # scheduler — enqueues board:fetch for every station whose fetch_offset
  # matches the current minute slot (30-min cadence, ~180 stations/minute).
  scheduler:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:alpine
        WORKDIR /app
        COPY . .
        RUN go mod download
        RUN go build -o /app/bin/scheduler ./cmd/scheduler
        CMD ["/app/bin/scheduler"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile_inline: |
        FROM node:alpine AS web
        WORKDIR /web
        COPY web/package.json web/package-lock.json ./
        RUN npm ci
        COPY web/ ./
        RUN npm run build
        FROM golang:alpine AS go
        WORKDIR /app
        COPY . .
        COPY --from=web /web/dist ./web/dist
        RUN go mod download
        RUN go build -o /app/bin/api ./cmd/api
        CMD ["/app/bin/api"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_DSN=postgres://bahnhof:${POSTGRES_PASSWORD}@postgres:5432/bahnhof?sslmode=disable
      - API_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  verspaetet_pg:
    name: bahn-downfall_bahn_downfall_pg
  verspaetet_redis: